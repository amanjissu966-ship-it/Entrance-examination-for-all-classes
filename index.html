<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online MCQ Test</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 600px;
  margin: 20px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}
input, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
}
button {
  background: #2563eb;
  color: white;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}
#test, #dashboard { display: none; }
</style>
</head>
<body>

<div class="container">
  <h1>Online MCQ Test</h1>

  <section id="auth">
    <h2>Student Registration / Login</h2>
    <input id="name" placeholder="Student Name (registration)">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password (minimum 6 characters)">

    <button id="registerBtn">Create Account</button>
    <button id="loginBtn">Login</button>
    <p id="message"></p>
  </section>

  <section id="dashboard">
    <h2>Welcome, <span id="studentName">Student</span>!</h2>
    <button id="startBtn">Start MCQ Test</button>
    <button id="logoutBtn">Logout</button>
    <p id="previousResult"></p>
  </section>

  <section id="test">
    <h2>MCQ Test</h2>
    <form id="quiz"></form>
    <button id="submitBtn" type="button">Submit Test</button>
    <p id="result"></p>
  </section>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  get
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

// अपने Firebase Console के असली Config से बदलें।
const firebaseConfig = {
  apiKey: "AIzaSyAyA-Gq-FmQBOJZ1PW19Nt2QmjHyoTA01So",
  authDomain: "class-11th-chemistry-some-basi.firebaseapp.com",
  databaseURL: "https://class-11th-chemistry-some-basi-default-rtdb.firebaseio.com",
  projectId: "class-11th-chemistry-some-basi",
  storageBucket: "class-11th-chemistry-some-basi.firebasestorage.app",
  messagingSenderId: "98841584164",
  appId: "1:98841584164:web:3c27a55ac8b3b9df5eaeb1",
  measurementId: "G-4Y8VQF62N8"
};
const db = getDatabase(app);

const $ = id => document.getElementById(id);

const questions = [
  {
    q: "Which is a rational number?",
    options: ["√2", "π", "3/4", "√3"],
    answer: 2
  },
  {
    q: "What is the value of 2³?",
    options: ["4", "6", "8", "9"],
    answer: 2
  },
  {
    q: "The sum of angles of a triangle is:",
    options: ["90°", "180°", "270°", "360°"],
    answer: 1
  }
];

let currentUser = null;

function showMessage(text) {
  $("message").textContent = text;
}

$("registerBtn").addEventListener("click", async () => {
  const name = $("name").value.trim();
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!name || !email || password.length < 6) {
    showMessage("Enter your name, email and a password of at least 6 characters.");
    return;
  }

  try {
    const credential = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await set(ref(db, "students/" + credential.user.uid), {
      name,
      email
    });

    showMessage("Registration successful!");
  } catch (error) {
    showMessage(error.message);
  }
});

$("loginBtn").addEventListener("click", async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );
    showMessage("Login successful!");
  } catch (error) {
    showMessage(error.message);
  }
});

onAuthStateChanged(auth, async user => {
  currentUser = user;

  $("auth").style.display = user ? "none" : "block";
  $("dashboard").style.display = user ? "block" : "none";
  $("test").style.display = "none";

  if (!user) return;

  try {
    const snapshot = await get(ref(db, "students/" + user.uid));
    const student = snapshot.val();

    $("studentName").textContent =
      student?.name || user.email || "Student";

    const resultSnapshot = await get(
      ref(db, "results/" + user.uid)
    );

    const previous = resultSnapshot.val();

    $("previousResult").textContent = previous
      ? "Last saved score: " + previous.score + "/" + previous.total
      : "No previous result yet.";
  } catch (error) {
    $("previousResult").textContent =
      "Database error: " + error.message;
  }
});

$("startBtn").addEventListener("click", () => {
  $("test").style.display = "block";
  $("result").textContent = "";

  $("quiz").innerHTML = questions.map((question, index) => `
    <fieldset style="margin:12px 0">
      <legend>${index + 1}. ${question.q}</legend>
      ${question.options.map((option, optionIndex) => `
        <label style="display:block;padding:5px">
          <input type="radio" name="q${index}" value="${optionIndex}"
          style="width:auto">
          ${option}
        </label>
      `).join("")}
    </fieldset>
  `).join("");
});

$("submitBtn").addEventListener("click", async () => {
  if (!currentUser) {
    $("result").textContent = "Please log in first.";
    return;
  }

  let score = 0;

  questions.forEach((question, index) => {
    const selected = document.querySelector(
      `input[name="q${index}"]:checked`
    );

    if (selected && Number(selected.value) === question.answer) {
      score++;
    }
  });

  $("result").textContent = `Your score: ${score}/${questions.length}`;

  try {
    await set(ref(db, "results/" + currentUser.uid), {
      score,
      total: questions.length,
      submittedAt: Date.now()
    });

    $("previousResult").textContent =
      `Last saved score: ${score}/${questions.length}`;

    $("result").textContent += " | Result saved!";
  } catch (error) {
    $("result").textContent +=
      " | Save failed: " + error.message;
  }
});

$("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (error) {
    alert(error.message);
  }
});
</script>

</body>
</html>
